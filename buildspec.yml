version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install -r requirements.txt
      - pip install flake8 nose
  build:
    commands:
      - flake8 .
      - nosetests --with-xunit --xunit-file=nosetests.xml

reports:
  nose-tests:
    files:
      - nosetests.xml
    file-format: JUNITXML